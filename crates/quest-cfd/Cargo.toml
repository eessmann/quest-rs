[package]
name = "quest-cfd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
mathcore.workspace = true
dashu-int.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
quest-numerics.workspace = true
quest-qsvt = { workspace = true, features = ["certification"] }
quest-qsp = { workspace = true, features = ["certification"] }
clap = { workspace = true, features = ["derive"] }

sha2 = { workspace = true, optional = true }
quest-qsvt-io = { workspace = true, optional = true }

quest = { workspace = true, optional = true, features = ["qsvt"] }

[lints]
workspace = true

[features]
quantum = ["dep:quest"]
distributed = ["quantum", "quest/mpi", "dep:quest-qsvt-io", "dep:sha2"]

[build-dependencies]
quest-build.workspace = true

[[example]]
name = "distributed_history"
required-features = ["distributed"]

[dev-dependencies]
quest-test-support.workspace = true
sha2.workspace = true
