[package]
name = "quest-qsvt-io"
version = "0.1.0"
edition.workspace = true
license = "MIT AND CC-BY-SA-4.0"
repository.workspace = true
description = "QSP and QSVT scientific interchange formats"

[dependencies]
thiserror.workspace = true
num-complex.workspace = true
hdf5-metno = { workspace = true, features = ["complex"] }
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
tempfile.workspace = true
quest-numerics.workspace = true
quest-qsvt.workspace = true
quest-qsp.workspace = true
quest-polynomial.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
faer = { workspace = true, default-features = false, features = ["std", "linalg"] }

[dev-dependencies]
googletest.workspace = true

[lints]
workspace = true

[features]
certification = ["quest-qsp/artifact"]
offline-synthesis = ["quest-qsp/offline-synthesis"]

[build-dependencies]
quest-build.workspace = true

[[example]]
name = "generalized_catalog"
required-features = ["certification"]
