[package]
name = "quest-compile"
version = "0.1.0"
description = "Shared staged compilation, specialization, optimization and artifact validation"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
sha2.workspace = true
codespan-reporting = { workspace = true, optional = true }
faer = { workspace = true, features = ["std", "linalg"] }
num-bigint = { workspace = true }
num-complex = { workspace = true }
num-rational = { workspace = true, features = ["std"] }
num-traits = { workspace = true }
petgraph = { workspace = true, features = ["std", "stable_graph"] }
quest-language = { workspace = true, features = ["templates"] }
quest-math = { workspace = true, optional = true }
quest-optimizer-client = { workspace = true, optional = true }
quest-optimizer-protocol = { workspace = true, optional = true }
quest-qasm.workspace = true
quest-symbolic.workspace = true
quest-synthesis = { workspace = true, optional = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
googletest = { workspace = true }
proptest = { workspace = true }
quest-math.workspace = true
trybuild = { workspace = true }

[features]
default = ["synthesis"]
codespan-reporting = ["dep:codespan-reporting", "quest-language/codespan-reporting", "quest-qasm/codespan-reporting"]
serde = ["quest-language/serde", "quest-qasm/serde"]
synthesis = ["dep:quest-synthesis", "dep:quest-optimizer-client", "dep:quest-optimizer-protocol", "dep:quest-math"]
workers = ["synthesis", "dep:quest-optimizer-client", "dep:quest-optimizer-protocol", "dep:quest-math"]
