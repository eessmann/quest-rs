[package]
name = "quest-qsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical and generalized quantum signal processing"

[dependencies]
thiserror.workspace = true
serde = { workspace = true, features = ["derive", "std"], optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
num-complex.workspace = true
quest-numerics.workspace = true
quest-polynomial.workspace = true
rayon = { workspace = true, optional = true }
dashu-base = { workspace = true, optional = true }
dashu-int = { workspace = true, optional = true }
dashu-float = { workspace = true, optional = true }

[dev-dependencies]
hdf5-metno.workspace = true
mathcore.workspace = true
criterion.workspace = true
googletest.workspace = true

[lints]
workspace = true

[features]
benchmark-support = ["dep:serde_json"]
artifact = ["certification", "dep:serde", "dep:serde_json", "dep:sha2"]
certification = ["dep:dashu-base", "dep:dashu-int", "dep:dashu-float"]
offline-synthesis = ["certification"]
rayon = ["dep:rayon", "quest-numerics/rayon"]
simd = ["quest-numerics/simd"]

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "replication"
harness = false
required-features = ["benchmark-support"]

[[bench]]
name = "matched_nlft"
harness = false
required-features = ["benchmark-support", "simd"]

[[example]]
name = "large_polynomial_acceptance"
required-features = ["benchmark-support", "simd"]
