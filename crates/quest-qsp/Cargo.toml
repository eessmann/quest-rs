[package]
name = "quest-qsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical and generalized quantum signal processing"

[dependencies]
thiserror.workspace = true
num-complex.workspace = true
quest-numerics.workspace = true
quest-polynomial.workspace = true
rayon = { workspace = true, optional = true }
astro-float = { workspace = true, features = ["std"], optional = true }

[dev-dependencies]
criterion.workspace = true
googletest.workspace = true

[lints]
workspace = true

[features]
certification = ["dep:astro-float"]
offline-synthesis = ["certification"]
rayon = ["dep:rayon", "quest-numerics/rayon"]
simd = ["quest-numerics/simd"]

[[bench]]
name = "pipeline"
harness = false
