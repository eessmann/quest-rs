[package]
name = "quest-optimizer-worker"
version = "0.1.0"
publish = false
description = "Isolated optional quantum optimization candidate engines"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quest-optimizer-protocol.workspace = true
quest-math = { workspace = true, features = ["serde"] }
serde_json.workspace = true
color-eyre = { workspace = true, features = ["track-caller"] }
dashu-int.workspace = true
quest-synthesis = { workspace = true, optional = true }
quizx = { workspace = true, optional = true }

[features]
default = []
synthesis = ["dep:quest-synthesis"]
zx = ["dep:quizx"]
mitm = []

[lints]
workspace = true

[dev-dependencies]
googletest.workspace = true
quest-compile = { workspace = true, features = ["workers"] }
quest-optimizer-client.workspace = true
