[package]
name = "quest-macros"
version = "0.1.0"
description = "OpenQASM-style circuit macro for the quest-circuit builder"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
num-traits.workspace = true
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quest-language = { workspace = true, features = ["templates"] }
quest-qasm.workspace = true
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }

[lints]
workspace = true

[dev-dependencies]
googletest.workspace = true
