[package]
edition = "2021"
name = "quest-mathcore"
version = "0.3.1-quest.1"
authors = ["Mehmet Yilmaz <mehmet@nonanti.dev>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
