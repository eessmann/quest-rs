[package]
name = "quest-circuit"
version = "0.1.0"
description = "Unified quantum program construction and compilation facade"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quest-compile.workspace = true
quest-macros = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
faer = { workspace = true, features = ["std", "linalg"] }
quest-language.workspace = true
quest-qasm.workspace = true
quest-optimizer-protocol.workspace = true
num-bigint.workspace = true
num-complex.workspace = true
num-traits.workspace = true

criterion.workspace = true
googletest = { workspace = true }
proptest = { workspace = true }
quest-math.workspace = true
trybuild = { workspace = true }

[features]
default = ["macros", "synthesis"]
macros = ["dep:quest-macros"]
codespan-reporting = ["quest-compile/codespan-reporting"]
serde = ["quest-compile/serde"]
synthesis = ["quest-compile/synthesis"]
workers = ["quest-compile/workers"]

[[bench]]
name = "compiler"
harness = false
required-features = ["macros"]
