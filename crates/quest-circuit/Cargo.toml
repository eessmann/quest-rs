[package]
name = "quest-circuit"
version = "0.1.0"
description = "Native-independent quantum circuits, exact algebra, and bounded numerical fusion"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
codespan-reporting = { workspace = true, optional = true }
faer = { workspace = true, features = ["std", "linalg"] }
num-bigint = { workspace = true }
num-complex = { workspace = true }
num-rational = { workspace = true, features = ["std"] }
num-traits = { workspace = true }
petgraph = { workspace = true, features = ["std", "stable_graph"] }
quest-language.workspace = true
quest-macros = { workspace = true, optional = true }
quest-math = { workspace = true, optional = true }
quest-optimizer-client = { workspace = true, optional = true }
quest-qasm.workspace = true
quest-symbolic.workspace = true
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
googletest = { workspace = true }
proptest = { workspace = true }
quest-math.workspace = true
trybuild = { workspace = true }

[features]
default = ["macros"]
macros = ["dep:quest-macros"]
codespan-reporting = ["dep:codespan-reporting", "quest-language/codespan-reporting", "quest-qasm/codespan-reporting"]
serde = ["quest-language/serde", "quest-qasm/serde"]
workers = ["dep:quest-optimizer-client", "dep:quest-math"]

[[bench]]
name = "compiler"
harness = false
required-features = ["macros"]
