[package]
name = "quest-sys"
version = "0.2.0"
edition.workspace = true
links = "QuEST"
description = "Low-level Rust bindings to the QuEST C++ quantum simulation toolkit"
license.workspace = true
repository.workspace = true
keywords = ["quantum", "simulation", "ffi", "bindings"]
categories = ["external-ffi-bindings", "science"]
build = "build.rs"

[features]
default = []
mpi = ["dep:mpi"]

[dependencies]
cxx = { workspace = true, features = ["std", "c++20"] }
thiserror.workspace = true
mpi = { workspace = true, optional = true }

[build-dependencies]
cxx-build = { workspace = true, features = ["parallel"] }
quest-build.workspace = true

[dev-dependencies]
quest-test-support.workspace = true
googletest.workspace = true
libc = { workspace = true }
serde_json.workspace = true

[[example]]
name = "min_example"
path = "examples/min_example.rs"

[[example]]
name = "mpi_large_count"
required-features = ["mpi"]

[lints]
workspace = true
