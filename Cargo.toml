[package]
name = "quest-rs"
version = "0.1.0"
edition = "2024"
description = "Idiomatic Rust interface to the QuEST quantum simulation toolkit"
license = "MIT"
repository = "https://github.com/eessmann/quest-rs"
readme = "README.md"
keywords = ["quantum", "simulation"]
categories = ["science", "simulation"]
build = "build.rs"

[workspace]
resolver = "2"
members = ["crates/quest-sys", "crates/xtask"]

[workspace.dependencies]
clang = { version = "2.0.0", features = ["runtime"] }
cmake-package = {version = "0.2"}
cxx = { version = "1.0", features = ["std", "alloc", "c++20"] }
cxx-build = {version = "1.0", features = ["parallel"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0"}
miette = {version = "7.6.0", features = ["fancy"]}
ndarray = { version = "0.17", features = ["default", "approx", "blas"] }
num = "0.4"
thiserror = "2.0"
googletest = "0.14"


[dependencies]
quest-sys = { path = "crates/quest-sys", version = "0.2" }
ndarray.workspace = true
num.workspace = true
cxx.workspace = true
miette.workspace = true
thiserror.workspace = true

[build-dependencies]
cmake-package.workspace = true
miette.workspace = true

[dev-dependencies]
googletest.workspace = true

[[example]]
name = "minimal"
path = "examples/minimal.rs"
