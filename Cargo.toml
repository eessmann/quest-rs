[workspace]
resolver = "3"
members = ["crates/quest", "crates/quest-sys", "crates/quest-build", "crates/quest-circuit", "crates/quest-macros", "crates/xtask"]
default-members = ["crates/quest"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/eessmann/quest-rs"

[workspace.dependencies]
quest-sys = { path = "crates/quest-sys", version = "0.2" }
quest-build = { path = "crates/quest-build", version = "0.1" }
quest-circuit = { path = "crates/quest-circuit", version = "0.1" }
quest-macros = { path = "crates/quest-macros", version = "0.1" }
clang = { version = "2.1", default-features = false }
cxx = { version = "1", default-features = false }
cxx-build = { version = "1", default-features = false }
serde = { version = "1", default-features = false }
serde_json = "1"
thiserror = "2"
googletest = "0.14"

faer = { version = "0.24.4", default-features = false }
num-complex = "0.4"
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
ndarray = { version = "0.17", default-features = false }
codespan-reporting = "0.13"
petgraph = { version = "0.8", default-features = false }
syn = "3"
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
cmake-file-api = "0.1.2"
sha2 = "0.10"
shlex = "1"
tempfile = "3"
trybuild = "1"
proptest = "1.11"
anyhow = "1"
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }   # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }    # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
