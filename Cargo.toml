[workspace]
resolver = "3"
members = ["crates/vendor/mathcore", "crates/quest", "crates/quest-sys", "crates/quest-build", "crates/quest-test-support", "crates/quest-compile", "crates/quest-symbolic", "crates/quest-macros", "crates/xtask", "crates/quest-language", "crates/quest-qasm", "crates/quest-math", "crates/quest-synthesis", "crates/quest-optimizer-protocol", "crates/quest-optimizer-worker", "crates/quest-optimizer-client", "crates/quest-numerics", "crates/quest-polynomial", "crates/quest-qsp", "crates/quest-qsvt", "crates/quest-qsvt-io", "crates/quest-qsvt-cli", "crates/quest-cfd"]
default-members = ["crates/quest"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/eessmann/quest-rs"

[workspace.dependencies]
mathcore = { package = "quest-mathcore", path = "crates/vendor/mathcore", version = "0.3.1-quest.2" }
dashu-base = { version = "0.6", default-features = false, features = ["std"] }
dashu-int = { version = "0.6", default-features = false, features = ["std"] }
dashu-ratio = { version = "0.6", default-features = false, features = ["std"] }
dashu-float = { version = "0.6", default-features = false, features = ["std"] }
quest = { package = "quest-rs", path = "crates/quest", version = "0.1" }
clap = { version = "4.6", features = ["wrap_help", "suggestions"] }
mpi = { version = "0.8", features = ["user-operations"] }
rustfft = { version = "6.4", features = [] }
maryada = { version = "0.2", features = [] }
rayon = { version = "1.12", features = [] }
hdf5-metno = { version = "0.15", features = [] }
quest-numerics = { path = "crates/quest-numerics", version = "0.1" }
quest-polynomial = { path = "crates/quest-polynomial", version = "0.1" }
quest-qsp = { path = "crates/quest-qsp", version = "0.1" }
quest-qsvt = { path = "crates/quest-qsvt", version = "0.1" }
quest-qsvt-io = { path = "crates/quest-qsvt-io", version = "0.1" }
criterion = { version = "0.8", features = [] }
quizx = "0.3"
rustix = { version = "1", features = [] }
quest-optimizer-client = { path = "crates/quest-optimizer-client", version = "0.1" }
quest-optimizer-protocol = { path = "crates/quest-optimizer-protocol", version = "0.1" }
quest-math = { path = "crates/quest-math", version = "0.1" }
quest-synthesis = { path = "crates/quest-synthesis", version = "0.1" }
quest-qasm = { path = "crates/quest-qasm", version = "0.1" }
quest-language = { path = "crates/quest-language", version = "0.1" }
color-eyre = { version = "0.6.5", default-features = false }
quest-sys = { path = "crates/quest-sys", version = "0.2" }
quest-build = { path = "crates/quest-build", version = "0.1" }
quest-test-support = { path = "crates/quest-test-support", version = "0.1" }
build-probe-mpi = "=0.1.6"
cc = "1"
pkg-config = "0.3"
quest-compile = { path = "crates/quest-compile", version = "0.1", default-features = false }
quest-symbolic = { path = "crates/quest-symbolic", version = "0.1" }
quest-macros = { path = "crates/quest-macros", version = "0.1" }
clang = { version = "2.1", features = [] }
cxx = { version = "1", features = ["c++20"] }
cxx-build = { version = "1", features = ["parallel"] }
serde = { version = "1", features = [] }
serde_json = "1"
toml = "1.1"
csv = "1.4"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
thiserror = "2"
googletest = "0.14"

faer = { version = "0.24", features = [] }
num-complex = "0.4"
num-traits = "0.2"
ndarray = { version = "0.17", features = [] }
codespan-reporting = "0.13"
petgraph = { version = "0.8", features = [] }
syn = "3"
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
cmake-file-api = "0.1.2"
sha2 = "0.11"
shlex = "2"
tempfile = "3"
trybuild = "1"
proptest = "1.11"
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }   # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }    # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
