name: quest-native-scaling-build
description: Compile only the release scaling example in an exclusive single-node Cirrus allocation.
use_pending_failed: false
execution_config:
  mode: direct
  limit_resources: false
jobs:
  - name: native-scaling-build
    command: bash -l "$QUEST_SOURCE/docs/verification/fixtures/cirrus/native-validation.sbatch"
    resource_requirements: scaling-build
resource_requirements:
  - name: scaling-build
    num_cpus: 8
    num_nodes: 1
    memory: 32g
    runtime: PT1H45M
